name: RedFox connection check

on:
  workflow_dispatch:
  # Initial integration check on this development branch; never runs on a PR or daily schedule.
  push:
    branches: [feat/dipei-radar]
    paths:
      - .github/workflows/redfox-check.yml
      - scripts/check_redfox.py

permissions:
  contents: read

concurrency:
  group: redfox-connection-check
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'buxahomes/SIDE-OS'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out reviewed branch code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Offline tests
        run: python3 -m unittest discover -s tests -v
      - name: Check RedFox access (at most two data requests)
        env:
          REDFOX_API_KEY: ${{ secrets.REDFOX_API_KEY }}
        run: python3 scripts/check_redfox.py
